# Ejemplo de pipeline de Ploomber para orquestar los cuadernos del proyecto de marketing bancario

# Opcional: Configurar meta ajustes si es necesario, como rutas predeterminadas para productos
# meta:
#   source_loader:
#     kind: NotebookSourceLoader
#   product_default_class: File # Podría ser File o SQLRelation etc.

tasks:
  - source: feature_pipeline/feature_engineering.ipynb
    name: feature-engineering # Opcional, Ploomber puede inferir del nombre de la fuente
    product:
      # Ploomber típicamente espera un producto principal por tarea para encadenamiento,
      # pero una tarea puede producir múltiples archivos.
      # Los listamos aquí para claridad y posible verificación.
      # La salida principal que podría ser usada por una tarea descendente es 'data'.
      data: feature_pipeline/bank-features-selected.csv
      selected_features_json: feature_pipeline/selected_feature_names.json
      executed_notebook: feature_pipeline/executed_feature_engineering_ploomber.ipynb # Ploomber puede guardar el cuaderno ejecutado

  - source: training_pipeline/model_training.ipynb
    name: model-training
    # Ploomber también puede gestionar el registro de MLflow implícitamente si está configurado,
    # o el cuaderno lo maneja como lo hace ahora.
    product:
      model: training_pipeline/best_tuned_model.joblib
      executed_notebook: training_pipeline/executed_model_training_ploomber.ipynb
    upstream:
      # Esta tarea depende de las características generadas por la tarea feature-engineering.
      # Ploomber pasará el producto 'data' de 'feature-engineering'
      # como una variable 'upstream' a este cuaderno si el cuaderno lo espera.
      # El cuaderno 'model_training.ipynb' necesita poder aceptar 'upstream["feature-engineering"]["data"]'
      # o simplemente conocer la ruta a 'bank-features-selected.csv'.
      # Por simplicidad, este ejemplo asume que el cuaderno conoce la ruta.
      # Si se desea el paso de parámetros, el cuaderno necesita una celda 'parameters'
      # y Ploomber inyecta las variables 'upstream' y 'product'.
      - feature-engineering # Depende de la tarea 'feature-engineering' por nombre

  # Opcional: Tarea de Inferencia por Lotes
  # Esta tarea típicamente se ejecutaría sobre datos nuevos, no encadenada directamente aquí a menos que
  # la tarea feature_engineering esté parametrizada para ejecutarse sobre diferentes entradas de datos crudos.
  # Por ahora, la incluimos para mostrar cómo se vería.
  - source: inference_pipeline/batch_inference.ipynb
    name: batch-inference
    product:
      predictions: inference_pipeline/predictions_ploomber.csv
      executed_notebook: inference_pipeline/executed_batch_inference_ploomber.ipynb
    upstream:
      # Depende del modelo de 'model-training' y potencialmente nuevas características.
      # El cuaderno 'batch_inference.ipynb' necesitaría conocer la ruta del modelo upstream.
      - model-training
      # Si 'feature-engineering' produjo un conjunto general de características para inferencia
      # (no solo la división de entrenamiento), también podría ser una dependencia upstream.
      # Para este ejemplo, asumimos que el cuaderno de inferencia carga características independientemente
      # o usa una versión de características alineada con el modelo entrenado.

# Para hacer que los cuadernos sean conscientes de Ploomber para la inyección de parámetros (opcional pero potente):
# 1. Añade una celda con la etiqueta 'parameters' a tus cuadernos de entrada.
# 2. Ploomber inyectará las variables 'upstream' y 'product' en esa celda si existen.
# Ejemplo de celda 'parameters' en model_training.ipynb:
# upstream = None # Será inyectado por Ploomber
# product = None # Será inyectado por Ploomber
# input_features_path = upstream['feature-engineering']['data'] if upstream else 'feature_pipeline/bank-features-selected.csv'
# output_model_path = product['model'] if product else 'training_pipeline/best_tuned_model.joblib'

# Sin inyección de parámetros, los cuadernos deben depender de rutas relativas predefinidas,
# que es como están configurados actualmente. Este pipeline.yaml aún ayudará a
# orquestar el orden de ejecución.
