name: Feature Engineering Pipeline

on:
  workflow_dispatch: # Manual trigger
  push:
    branches:
      - main
    paths:
      - 'feature_pipeline/**'
      - 'requirements.txt'
      - '.github/workflows/feature_pipeline.yml'

jobs:
  run-feature-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v3
        with:
          python-version: '3.9' # Should match project's python version

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install papermill # Ensure papermill is installed

      - name: Create output directory if it doesn't exist
        run: mkdir -p feature_pipeline # Ensure the output directory exists

      - name: Run Feature Engineering Notebook
        run: |
          papermill \
            feature_pipeline/feature_engineering.ipynb \
            feature_pipeline/executed_feature_engineering.ipynb \
            -p timestamp $(date +%s) # Example of passing a parameter, can be removed if not needed by notebook
        # The notebook itself saves 'bank-features-selected.csv' and 'selected_feature_names.json'
        # to the 'feature_pipeline/' directory.

      - name: Commit and push outputs
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add feature_pipeline/bank-features-selected.csv
          git add feature_pipeline/selected_feature_names.json
          git add feature_pipeline/executed_feature_engineering.ipynb # Commit the executed notebook
          # Check if there are changes to commit
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Automated feature engineering pipeline run"
            git push
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
