name: Feature Engineering Pipeline

on:
  workflow_dispatch: # Disparador manual
  push:
    branches:
      - main
    paths:
      - 'feature_pipeline/**'
      - 'requirements.txt'
      - '.github/workflows/feature_pipeline.yml'

jobs:
  run-feature-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v3
        with:
          python-version: '3.9' # Debe coincidir con la versión de python del proyecto

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install papermill # Asegurar que papermill esté instalado

      - name: Create output directory if it doesn't exist
        run: mkdir -p feature_pipeline # Asegurar que el directorio de salida exista

      - name: Run Feature Engineering Notebook
        run: |
          papermill \
            feature_pipeline/feature_engineering.ipynb \
            feature_pipeline/executed_feature_engineering.ipynb \
            -p timestamp $(date +%s) # Ejemplo de pasar un parámetro, puede eliminarse si el cuaderno no lo necesita
        # El cuaderno mismo guarda 'bank-features-selected.csv' y 'selected_feature_names.json'
        # en el directorio 'feature_pipeline/'.

      - name: Commit and push outputs
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add feature_pipeline/bank-features-selected.csv
          git add feature_pipeline/selected_feature_names.json
          git add feature_pipeline/executed_feature_engineering.ipynb # Confirmar el cuaderno ejecutado
          # Verificar si hay cambios para confirmar
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Automated feature engineering pipeline run"
            git push
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
