name: Model Training Pipeline

on:
  workflow_dispatch: # Disparador manual
  push:
    branches:
      - main
    paths:
      - 'training_pipeline/**'
      - 'feature_pipeline/bank-features-selected.csv' # Disparar si nuevas características están disponibles
      - 'feature_pipeline/selected_feature_names.json'
      - 'requirements.txt'
      - '.github/workflows/training_pipeline.yml'

jobs:
  run-training-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0 # Requerido para verificar cambios a confirmar

      - name: Set up Python
        uses: actions/setup-python@v3
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install papermill mlflow # Asegurar que papermill y mlflow estén instalados

      - name: Create output directory if it doesn't exist
        run: mkdir -p training_pipeline # Asegurar que el directorio de salida para el cuaderno ejecutado exista

      - name: Run Model Training Notebook
        run: |
          papermill             training_pipeline/model_training.ipynb             training_pipeline/executed_model_training.ipynb
        # El cuaderno mismo guarda 'best_tuned_model.joblib' en el directorio 'training_pipeline/'.
        # También registra en MLflow. Para este flujo de trabajo básico, asumimos el registro local de MLflow.
        # El directorio mlruns se crearía en la raíz.

      - name: Commit and push outputs
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add training_pipeline/best_tuned_model.joblib
          git add training_pipeline/executed_model_training.ipynb
          git add mlruns # Añadir directorio mlruns (datos de seguimiento local de MLflow)
          # Verificar si hay cambios para confirmar
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Automated model training pipeline run and MLflow logging"
            git push
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
