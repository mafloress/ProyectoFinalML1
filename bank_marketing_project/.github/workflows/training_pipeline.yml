name: Model Training Pipeline

on:
  workflow_dispatch: # Manual trigger
  push:
    branches:
      - main
    paths:
      - 'training_pipeline/**'
      - 'feature_pipeline/bank-features-selected.csv' # Trigger if new features are available
      - 'feature_pipeline/selected_feature_names.json'
      - 'requirements.txt'
      - '.github/workflows/training_pipeline.yml'

jobs:
  run-training-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0 # Required to check for changes to commit

      - name: Set up Python
        uses: actions/setup-python@v3
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install papermill mlflow # Ensure papermill and mlflow are installed

      - name: Create output directory if it doesn't exist
        run: mkdir -p training_pipeline # Ensure the output directory for executed notebook exists

      - name: Run Model Training Notebook
        run: |
          papermill             training_pipeline/model_training.ipynb             training_pipeline/executed_model_training.ipynb
        # The notebook itself saves 'best_tuned_model.joblib' to the 'training_pipeline/' directory.
        # It also logs to MLflow. For this basic workflow, we assume local MLflow logging.
        # The mlruns directory would be created in the root.

      - name: Commit and push outputs
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add training_pipeline/best_tuned_model.joblib
          git add training_pipeline/executed_model_training.ipynb
          git add mlruns # Add mlruns directory (MLflow local tracking data)
          # Check if there are changes to commit
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Automated model training pipeline run and MLflow logging"
            git push
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
